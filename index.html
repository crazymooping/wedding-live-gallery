<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUI & FLOOK — Live Gallery</title>
    <!-- โหลด Google Fonts: Cormorant Garamond & Noto Serif Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FAF7F2;
            --text-main: #3E2F2B;
            --text-muted: #8C7A70;
            --champagne-gold: #B89B6A;
            --gold-light: rgba(184, 155, 106, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif Thai', -apple-system, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 36px 12px 60px;
            text-align: center;
            min-height: 100vh;
        }

        /* ส่วนหัว Header แก้ไขสัดส่วนบนมือถือ */
        header {
            max-width: 800px;
            margin: 0 auto 32px;
        }

        .live-badge {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--champagne-gold);
            font-weight: 400;
            margin-bottom: 12px;
            line-height: 1;
        }

        .pulsing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--champagne-gold);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px var(--champagne-gold); }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        h1.couple-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            line-height: 1.2;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .event-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--champagne-gold);
            margin-top: 8px;
            font-weight: 400;
        }

        .gold-divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
            margin: 18px auto 0;
        }

        /* Grid ตอบสนองสมบูรณ์แบบบนมือถือ (บังคับ 2 คอลัมน์เสมอ) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1050px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            body { padding: 50px 16px 80px; }
            header { margin-bottom: 40px; }
            h1.couple-title { font-size: 42px; letter-spacing: 5px; }
            .event-date { font-size: 14px; letter-spacing: 6px; }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
                gap: 16px;
            }
        }

        @media (min-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
                gap: 20px;
            }
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 6px;
            background-color: #EFECE6;
            cursor: pointer;
            border: 1px solid var(--gold-light);
            box-shadow: 0 4px 15px rgba(62, 47, 43, 0.04);
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            animation: fadeIn 0.5s ease forward;
            will-change: transform;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-item:hover, .photo-item:active {
            transform: translateY(-3px);
            border-color: var(--champagne-gold);
            box-shadow: 0 8px 20px rgba(184, 155, 106, 0.2);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        /* ป้ายเวลาแสดงผลมุมซ้ายล่าง */
        .time-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(24, 18, 16, 0.65);
            color: #FAF7F2;
            font-size: 9.5px;
            font-weight: 300;
            padding: 2px 7px;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 14, 13, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 92%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalZoom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalZoom {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-actions {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: #FAF7F2;
            padding: 10px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 300;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 1px;
            border: 1px solid var(--champagne-gold);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: var(--champagne-gold);
            color: #120E0D;
        }

        .save-tip {
            font-size: 11px;
            color: rgba(250, 247, 242, 0.6);
            font-weight: 300;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 28px;
            color: rgba(250, 247, 242, 0.6);
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #FAF7F2;
        }
    </style>
</head>

<body>

    <header>
        <div class="live-badge">
            <span class="pulsing-dot"></span>LIVE GALLERY
        </div>
        <h1 class="couple-title">Pui & Flook</h1>
        <div class="event-date">01 · 11 · 2026</div>
        <div class="gold-divider"></div>
    </header>

    <div class="gallery-grid" id="gallery"></div>

    <div id="photoModal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="hideModal()">&times;</span>
        <img class="modal-content" id="modalImg" src="" alt="Preview">
        <div class="modal-actions" onclick="event.stopPropagation()">
            <a id="downloadBtn" class="download-btn" href="" target="_blank">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                ดาวน์โหลดรูปต้นฉบับ
            </a>
            <span class="save-tip">💡 กดค้างที่รูปภาพเพื่อเลือก "บันทึกไปยังแอปรูปภาพ" (Save to Photos)</span>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDO1Kf973lGe2_q6JoaXQvxQV9V25N16_A';
        const FOLDER_ID = '12dJgrFnKC44Y5iHnH-NH_zkyM9TgLqlK';

        const imageCache = new Map();

        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes} น.`;
        }

        function preloadHighRes(fastPreviewUrl, fullUrl) {
            if (!imageCache.has(fullUrl)) {
                const img = new Image();
                img.src = fastPreviewUrl;
                const fullImg = new Image();
                fullImg.src = fullUrl;
                imageCache.set(fullUrl, true);
            }
        }

        function getBaseFileName(name) {
            return name.replace(/\s*\(\d+\)\s*/g, '').replace(/_copy\d*/gi, '').toLowerCase();
        }

        async function fetchPhotos() {
            if (document.getElementById('photoModal').classList.contains('active')) return;

            const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,name,createdTime)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const gallery = document.getElementById('gallery');

                if (data.files && data.files.length > 0) {
                    const existingIds = new Set([...document.querySelectorAll('.photo-item')].map(item => item.getAttribute('data-id')));
                    const existingNames = new Set([...document.querySelectorAll('.photo-item img')].map(img => img.getAttribute('data-clean-name')));

                    const fragment = document.createDocumentFragment();
                    let hasNewPhoto = false;

                    data.files.forEach(file => {
                        const cleanName = getBaseFileName(file.name);

                        if (!existingIds.has(file.id) && !existingNames.has(cleanName)) {
                            hasNewPhoto = true;
                            existingIds.add(file.id);
                            existingNames.add(cleanName);

                            const item = document.createElement('div');
                            item.className = 'photo-item';
                            item.setAttribute('data-id', file.id);

                            const thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=s400`;
                            const fastPreviewUrl = `https://lh3.googleusercontent.com/d/${file.id}=s1600`;
                            const fullUrl = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
                            const timeText = formatTime(file.createdTime);

                            item.innerHTML = `
                                <img src="${thumbUrl}" alt="${file.name}" data-clean-name="${cleanName}" crossorigin="anonymous" loading="lazy" 
                                     ontouchstart="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onmouseenter="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onclick="openModal('${fastPreviewUrl}', '${fullUrl}', '${file.id}')">
                                <div class="time-badge">🕒 ${timeText}</div>
                            `;
                            fragment.appendChild(item);
                        }
                    });

                    if (hasNewPhoto) {
                        gallery.insertBefore(fragment, gallery.firstChild);
                    }
                }
            } catch (err) { console.error(err); }
        }

        function openModal(fastPreviewUrl, fullUrl, fileId) {
            const modalImg = document.getElementById('modalImg');
            
            modalImg.src = fastPreviewUrl;
            modalImg.srcset = `${fullUrl} 1x`;
            
            document.getElementById('downloadBtn').href = fullUrl;
            document.getElementById('photoModal').classList.add('active');

            const fullImg = new Image();
            fullImg.src = fullUrl;
            fullImg.onload = () => {
                modalImg.src = fullUrl;
            };
        }

        function hideModal() { 
            const modalImg = document.getElementById('modalImg');
            modalImg.src = '';
            modalImg.srcset = '';
            document.getElementById('photoModal').classList.remove('active'); 
        }

        function closeModal(event) { if (event.target.classList.contains('modal')) hideModal(); }

        window.addEventListener('DOMContentLoaded', () => {
            fetchPhotos();
            setInterval(fetchPhotos, 6000);
        });
    </script>
</body>

</html>
