<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #faf6f0;
            color: #4a3e3d;
            padding: 24px 12px;
            text-align: center;
        }
        header {
            margin-bottom: 28px;
        }
        .wedding-badge {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b5838d;
            background: #f4e8e1;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #6b4c4c;
        }
        p {
            font-size: 13px;
            color: #8c7a70;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }
        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
        }
        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(181, 131, 141, 0.12);
            cursor: pointer;
            border: 2px solid #ffffff;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .photo-item:active img {
            transform: scale(0.95);
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(45, 36, 36, 0.85);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border: 3px solid #ffffff;
        }
        .modal-actions {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .download-btn {
            background: linear-gradient(135deg, #e8a598, #b5838d);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(181, 131, 141, 0.4);
            transition: transform 0.2s;
        }
        .download-btn:active {
            transform: scale(0.96);
        }
        .save-tip {
            font-size: 11px;
            color: #f4e8e1;
            opacity: 0.8;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="wedding-badge">LIVE GALLERY</div>
        <h1>OUR CONGRATE DAY</h1>
        <p>✨ ภาพถ่ายอัปเดตจากกล้องช่างภาพ (แตะที่รูปเพื่อชมและดาวน์โหลด)</p>
    </header>

    <div class="gallery-grid" id="gallery"></div>

    <div id="photoModal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="hideModal()">&times;</span>
        <img class="modal-content" id="modalImg" src="" alt="Preview">
        <div class="modal-actions" onclick="event.stopPropagation()">
            <a id="downloadBtn" class="download-btn" href="" target="_blank">🌸 บันทึกรูปภาพ</a>
            <span class="save-tip">💡 กดค้างที่รูปภาพเพื่อเลือก "บันทึกไปยังแอปรูปภาพ" (Save to Photos)</span>
        </div>
    </div>

    <script>
        // 📌 (ใส่ Google API Key ของคุณในอัญประกาศด้านล่าง)
        const API_KEY = 'AIzaSyD0zv2sEXLM4kzqoG7FhdxaJmrS46DNDb0';

        // 📌 (ใส่ Google Drive Folder ID ของคุณในอัญประกาศด้านล่าง)
        const FOLDER_ID = '1Dt0KzbuWXGiIeQeglfSHLyYYL9BgNoKw';

        async function fetchPhotos() {
            if (API_KEY.includes('ใส่_GOOGLE_API_KEY')) {
                document.getElementById('gallery').innerHTML = '<p style="color:#b5838d; grid-column: 1/-1;">กรุณาใส่ Google API Key ในไฟล์ index.html</p>';
                return;
            }

            const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,name)&key=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                const gallery = document.getElementById('gallery');

                if (data.files && data.files.length > 0) {
                    gallery.innerHTML = '';
                    data.files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = 'photo-item';
                        
                        const thumbUrl = `https://drive.google.com/thumbnail?id=${file.id}&sz=w800`;
                        const previewUrl = `https://drive.google.com/thumbnail?id=${file.id}&sz=w1600`;
                        
                        item.innerHTML = `
                            <img src="${thumbUrl}" alt="${file.name}" loading="lazy" onclick="openModal('${previewUrl}', '${file.id}')">
                        `;
                        gallery.appendChild(item);
                    });
                } else {
                    gallery.innerHTML = '<p style="grid-column: 1/-1; color:#a08d85;">กำลังรอรูปภาพแรกจากกล้องช่างภาพ...</p>';
                }
            } catch (err) {
                console.error("Error fetching photos:", err);
            }
        }

        function openModal(previewUrl, fileId) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            const downloadBtn = document.getElementById('downloadBtn');

            modalImg.src = previewUrl;
            
            // เปิดรูปต้นฉบับขนาดเต็มเพื่อรองรับการกดค้าง Save to Photos ลงแอปรูปภาพมือถือ
            const directImageUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
            downloadBtn.href = directImageUrl;
            
            modal.classList.add('active');
        }

        function hideModal() {
            document.getElementById('photoModal').classList.remove('active');
        }

        function closeModal(event) {
            if (event.target.classList.contains('modal')) hideModal();
        }

        fetchPhotos();
        setInterval(fetchPhotos, 8000);
    </script>
</body>
</html>
