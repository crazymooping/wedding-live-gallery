<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gallery By P'WAT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #faf6f0;
            color: #4a3e3d;
            padding: 24px 12px;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        .wedding-badge {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b5838d;
            background: #f4e8e1;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #6b4c4c;
        }

        p {
            font-size: 13px;
            color: #8c7a70;
            margin-bottom: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(181, 131, 141, 0.12);
            cursor: pointer;
            border: 2px solid #ffffff;
            will-change: transform;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(45, 36, 36, 0.85);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            object-fit: contain;
            border: 3px solid #ffffff;
            -webkit-user-select: auto;
            user-select: auto;
            -webkit-touch-callout: default;
        }

        .modal-actions {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .download-btn {
            background: linear-gradient(135deg, #e8a598, #b5838d);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .save-tip {
            font-size: 12px;
            color: #f4e8e1;
            opacity: 0.9;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 15px;
            margin-top: 4px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="wedding-badge">LIVE GALLERY</div>
        <h1>1/11/26 PUI & FLOOK</h1>
        <p>✨ ภาพถ่ายอัปเดตจากกล้องช่างภาพ (แตะที่รูปเพื่อชมและดาวน์โหลด)</p>
    </header>

    <div class="gallery-grid" id="gallery"></div>

    <div id="photoModal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="hideModal()">&times;</span>
        <img class="modal-content" id="modalImg" src="" alt="Preview">
        <div class="modal-actions" onclick="event.stopPropagation()">
            <a id="downloadBtn" class="download-btn" href="" target="_blank">🌸 เปิดรูปขนาดเต็ม (Full HD)</a>
            <span class="save-tip">💡 กดค้างที่รูปภาพเพื่อเลือก "บันทึกไปยังแอปรูปภาพ" (Save to Photos)</span>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDO1Kf973lGe2_q6JoaXQvxQV9V25N16_A';
        const FOLDER_ID = '12dJgrFnKC44Y5iHnH-NH_zkyM9TgLqlK';

        const imageCache = new Map();

        // Preload รูปความละเอียดสูงล่วงหน้าเมื่อเริ่มแตะที่รูปภาพ
        function preloadHighRes(fastPreviewUrl, fullUrl) {
            if (!imageCache.has(fullUrl)) {
                const img = new Image();
                img.src = fastPreviewUrl;
                const fullImg = new Image();
                fullImg.src = fullUrl;
                imageCache.set(fullUrl, true);
            }
        }

        // ฟังก์ชันคลีนชื่อไฟล์เพื่อดักจับรูปซ้ำกรณีชื่อมี (1), _copy เป็นต้น
        function getBaseFileName(name) {
            return name.replace(/\s*\(\d+\)\s*/g, '').replace(/_copy\d*/gi, '').toLowerCase();
        }

        async function fetchPhotos() {
            // หยุดการดึงรูปชั่วคราวขณะที่เปิด Pop-up ดูรูป เพื่อประหยัด Bandwidth
            if (document.getElementById('photoModal').classList.contains('active')) return;

            const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,name)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const gallery = document.getElementById('gallery');

                if (data.files && data.files.length > 0) {
                    const existingIds = new Set([...document.querySelectorAll('.photo-item')].map(item => item.getAttribute('data-id')));
                    const existingNames = new Set([...document.querySelectorAll('.photo-item img')].map(img => img.getAttribute('data-clean-name')));

                    const fragment = document.createDocumentFragment();
                    let hasNewPhoto = false;

                    data.files.forEach(file => {
                        const cleanName = getBaseFileName(file.name);

                        // กรองไม่ให้เพิ่มทั้ง File ID ซ้ำ และ Clean Name ซ้ำ
                        if (!existingIds.has(file.id) && !existingNames.has(cleanName)) {
                            hasNewPhoto = true;
                            existingIds.add(file.id);
                            existingNames.add(cleanName);

                            const item = document.createElement('div');
                            item.className = 'photo-item';
                            item.setAttribute('data-id', file.id);

                            const thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=s400`;
                            const fastPreviewUrl = `https://lh3.googleusercontent.com/d/${file.id}=s1600`;
                            const fullUrl = `https://lh3.googleusercontent.com/d/${file.id}=s0`;

                            item.innerHTML = `
                                <img src="${thumbUrl}" alt="${file.name}" data-clean-name="${cleanName}" crossorigin="anonymous" loading="lazy" 
                                     ontouchstart="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onmouseenter="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onclick="openModal('${fastPreviewUrl}', '${fullUrl}', '${file.id}')">
                            `;
                            fragment.appendChild(item);
                        }
                    });

                    if (hasNewPhoto) {
                        gallery.insertBefore(fragment, gallery.firstChild);
                    }
                }
            } catch (err) { console.error(err); }
        }

        function openModal(fastPreviewUrl, fullUrl, fileId) {
            const modalImg = document.getElementById('modalImg');
            
            modalImg.src = fastPreviewUrl;
            modalImg.srcset = `${fullUrl} 1x`;
            
            document.getElementById('downloadBtn').href = fullUrl;
            document.getElementById('photoModal').classList.add('active');

            const fullImg = new Image();
            fullImg.src = fullUrl;
            fullImg.onload = () => {
                modalImg.src = fullUrl;
            };
        }

        function hideModal() { 
            const modalImg = document.getElementById('modalImg');
            modalImg.src = '';
            modalImg.srcset = '';
            document.getElementById('photoModal').classList.remove('active'); 
        }

        function closeModal(event) { if (event.target.classList.contains('modal')) hideModal(); }

        window.addEventListener('DOMContentLoaded', () => {
            fetchPhotos();
            setInterval(fetchPhotos, 6000);
        });
    </script>
</body>

</html>
