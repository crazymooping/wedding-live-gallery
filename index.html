<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Gallery by Piwat</title>
    <!-- โหลด Google Fonts: Cormorant Garamond & Noto Serif Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FAF7F2;
            --text-main: #3E2F2B;
            --text-muted: #8C7A70;
            --champagne-gold: #B89B6A;
            --gold-light: rgba(184, 155, 106, 0.25);
            --heart-red: #E74C3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Serif Thai', -apple-system, serif;
            display: flex;
            flex-direction: column;
            position: fixed;
            touch-action: pan-x;
        }

        /* Header */
        header {
            flex-shrink: 0;
            background-color: rgba(250, 247, 242, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(184, 155, 106, 0.15);
            position: relative;
        }

        .live-badge {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--champagne-gold);
            font-weight: 500;
            margin-bottom: 4px;
            line-height: 1;
        }

        .pulsing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--champagne-gold);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px var(--champagne-gold); }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        h1.couple-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(28px, 4.2vw, 48px);
            font-weight: 400;
            letter-spacing: 6px;
            line-height: 1.05;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .event-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(11px, 1.5vw, 16px);
            letter-spacing: 5px;
            color: var(--champagne-gold);
            margin-top: 3px;
            font-weight: 400;
        }

        .gold-divider {
            width: clamp(35px, 5vw, 70px);
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
            margin: 6px auto;
        }

        .switch-event-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: transparent;
            border: 1px solid var(--champagne-gold);
            color: var(--champagne-gold);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.25s ease;
        }

        .switch-event-btn:hover {
            background: var(--champagne-gold);
            color: #FAF7F2;
        }

        .filter-container {
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--champagne-gold);
            color: var(--text-main);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'Noto Serif Thai', serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .filter-btn.active {
            background: var(--champagne-gold);
            color: #FAF7F2;
            font-weight: 400;
            box-shadow: 0 2px 8px rgba(184, 155, 106, 0.3);
        }

        .scroll-hint {
            font-size: clamp(9px, 1vw, 11px);
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        .gallery-grid {
            display: grid;
            grid-template-rows: repeat(2, calc((100dvh - 280px) / 2));
            grid-auto-flow: column;
            grid-auto-columns: calc((100dvh - 280px) / 2);
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 16px;
            width: 100%;
            height: 100%;
            align-content: center;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--champagne-gold) transparent;
            touch-action: pan-x;
        }

        @media (min-width: 768px) {
            header { padding: 16px 16px 8px; }
            .gallery-grid {
                grid-template-rows: repeat(2, calc((100dvh - 330px) / 2));
                grid-auto-columns: calc((100dvh - 330px) / 2);
                gap: 14px;
                padding: 0 28px;
            }
        }

        .gallery-grid::-webkit-scrollbar {
            height: 4px;
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: var(--champagne-gold);
            border-radius: 10px;
        }

        .photo-item {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 6px;
            background-color: #EFECE6;
            cursor: pointer;
            border: 1px solid var(--gold-light);
            box-shadow: 0 4px 14px rgba(62, 47, 43, 0.05);
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            animation: fadeIn 0.5s ease forward;
            scroll-snap-align: start;
            will-change: transform;
        }

        .photo-item.hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .photo-item:hover, .photo-item:active {
            transform: scale(0.98);
            border-color: var(--champagne-gold);
            box-shadow: 0 6px 18px rgba(184, 155, 106, 0.2);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        .like-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(24, 18, 16, 0.45);
            border: none;
            color: #FAF7F2;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s ease;
            z-index: 10;
            font-size: 13px;
        }

        .like-btn:active {
            transform: scale(1.2);
        }

        .like-btn.liked {
            background: rgba(231, 76, 60, 0.85);
            color: #FFFFFF;
        }

        .time-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(24, 18, 16, 0.68);
            color: #FAF7F2;
            font-size: clamp(8px, 1vw, 10px);
            font-weight: 300;
            padding: 2px 6px;
            border-radius: 3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .empty-state {
            display: none;
            position: absolute;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            font-weight: 300;
            pointer-events: none;
        }

        footer {
            flex-shrink: 0;
            text-align: center;
            padding: 10px 12px 18px;
        }

        .thank-you-msg {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(16px, 2.4vw, 24px);
            letter-spacing: 2px;
            color: var(--champagne-gold);
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 14, 13, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.35s ease;
            touch-action: auto;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 92%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalZoom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalZoom {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: #FAF7F2;
            padding: 9px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 300;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 1px;
            border: 1px solid var(--champagne-gold);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: var(--champagne-gold);
            color: #120E0D;
        }

        .save-tip {
            font-size: 11px;
            color: rgba(250, 247, 242, 0.6);
            font-weight: 300;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            color: rgba(250, 247, 242, 0.6);
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #FAF7F2;
        }

        /* ========================================== */
        /* 🌟 ปุ่มเลือกงานแบบใส่รูปเจ้าบ่าวเจ้าสาว      */
        /* ========================================== */
        .portal-modal {
            display: flex;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(250, 247, 242, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .portal-modal.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .portal-box {
            text-align: center;
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.7);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid rgba(184, 155, 106, 0.25);
            box-shadow: 0 15px 35px rgba(62, 47, 43, 0.08);
        }

        .portal-main-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(28px, 5vw, 38px);
            color: var(--text-main);
            letter-spacing: 5px;
            margin-bottom: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .portal-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            color: var(--champagne-gold);
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .event-buttons-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* การ์ดปุ่มแบบมีรูปพื้นหลัง */
        .portal-event-btn {
            position: relative;
            width: 100%;
            height: 120px;
            border-radius: 12px;
            border: 1px solid var(--champagne-gold);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 6px 16px rgba(62, 47, 43, 0.08);
            background-size: cover;
            background-position: center;
            background-color: #EFECE6;
        }

        /* เลเยอร์มืดไล่ระดับ เพื่อให้ตัวหนังสืออ่านง่ายและลักชูรี */
        .portal-event-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(18, 14, 13, 0.25) 0%, rgba(18, 14, 13, 0.75) 100%);
            transition: background 0.3s ease;
        }

        .portal-event-btn:hover, .portal-event-btn:active {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(184, 155, 106, 0.35);
            border-color: #FAF7F2;
        }

        .portal-event-btn:hover::before, .portal-event-btn:active::before {
            background: linear-gradient(180deg, rgba(18, 14, 13, 0.15) 0%, rgba(18, 14, 13, 0.65) 100%);
        }

        /* ข้อความชื่องานในปุ่ม */
        .portal-event-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FAF7F2;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            padding: 10px;
        }

        .portal-event-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .portal-event-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: #dfba6c;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <!-- 🌟 ป๊อปอัปหน้าต่างเลือกงาน "Photo Gallery By Piwat" -->
    <div id="portalModal" class="portal-modal">
        <div class="portal-box">
            <h2 class="portal-main-title">Photo Gallery</h2>
            <div class="portal-subtitle">BY PIWAT</div>
            <div class="gold-divider" style="margin-bottom: 20px;"></div>
            <div class="event-buttons-list" id="eventButtonsList">
                <!-- รายชื่อปุ่มงานพร้อมรูปภาพจะถูกสร้างอัตโนมัติจาก JS -->
            </div>
        </div>
    </div>

    <header>
        <button class="switch-event-btn" onclick="openPortalModal()">🔄 เลือกงาน</button>
        <div class="live-badge">
            <span class="pulsing-dot"></span>LIVE GALLERY
        </div>
        <h1 class="couple-title" id="coupleTitle">Pui & Flook</h1>
        <div class="event-date" id="eventDate">01 · 11 · 2026</div>
        <div class="gold-divider"></div>
        
        <div class="filter-container">
            <button class="filter-btn active" id="btnAll" onclick="setFilter('all')">📷 แสดงทั้งหมด</button>
            <button class="filter-btn" id="btnFavorites" onclick="setFilter('favorites')">❤️ รูปที่ถูกใจ (<span id="favCount">0</span>)</button>
        </div>
        
        <div class="scroll-hint">👈 เลื่อนซ้าย-ขวาเพื่อชมรูปภาพ 👉</div>
    </header>

    <div class="gallery-container">
        <div class="gallery-grid" id="gallery"></div>
        <div class="empty-state" id="emptyState">คุณยังไม่ได้กดใจรูปภาพใดๆ 🤍</div>
    </div>

    <footer>
        <div class="thank-you-msg">Thank you for being part of our special day</div>
    </footer>

    <div id="photoModal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="hideModal()">&times;</span>
        <img class="modal-content" id="modalImg" src="" alt="Preview">
        <div class="modal-actions" onclick="event.stopPropagation()">
            <a id="downloadBtn" class="download-btn" href="" target="_blank">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                ดาวน์โหลดรูปต้นฉบับ
            </a>
            <span class="save-tip">💡 กดค้างที่รูปภาพเพื่อเลือก "บันทึกไปยังแอปรูปภาพ" (Save to Photos)</span>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ คลังข้อมูลงานทั้งหมด (ใส่อัปโหลดรูปภาพ coverImg เพิ่ม)
        // ==========================================
        const EVENTS_CONFIG = {
            'pui-flook': {
                title: 'Pui & Flook',
                date: '01 · 11 · 2026',
                folderId: '12dJgrFnKC44Y5iHnH-NH_zkyM9TgLqlK',
                // ใส่ลิงก์รูปคู่บ่าวสาว (ตัวอย่างใช้รูปจาก Google Drive ของงานนั้นเอง) https://drive.google.com/thumbnail?id=(ใส่idตรงนี้)&sz=w800
                coverImg: 'https://drive.google.com/thumbnail?id=15F8j-Fgd2p2k2GCfjYUsz_2EwT709AQ2&sz=w800'
            },/*
            'event-b': {
                title: 'test event B',
                date: '1 · 11 · 2026',
                folderId: 'YOUR_NEW_FOLDER_ID_B',
                coverImg: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80'
            },
            'event-c': {
                title: 'test event C',
                date: '1 · 11 · 2026',
                folderId: 'YOUR_NEW_FOLDER_ID_C',
                coverImg: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80'
            }*/
        };

        const API_KEY = 'AIzaSyDO1Kf973lGe2_q6JoaXQvxQV9V25N16_A';
        let currentEventKey = '';
        let FOLDER_ID = '';
        let STORAGE_KEY = '';

        const imageCache = new Map();
        let currentFilter = 'all';

        // สร้างการ์ดปุ่มเลือกระดับงานพร้อมรูปพื้นหลัง
        function renderPortalButtons() {
            const list = document.getElementById('eventButtonsList');
            list.innerHTML = '';
            
            Object.keys(EVENTS_CONFIG).forEach(key => {
                const ev = EVENTS_CONFIG[key];
                const btn = document.createElement('div');
                btn.className = 'portal-event-btn';
                
                // ถ้าระบุ coverImg จะใส่เป็นรูปพื้นหลัง ถ้าระบุไม่ได้จะใช้สีทองเรียบ
                if (ev.coverImg) {
                    btn.style.backgroundImage = `url('${ev.coverImg}')`;
                }

                btn.innerHTML = `
                    <div class="portal-event-content">
                        <div class="portal-event-title">${ev.title}</div>
                        <div class="portal-event-date">${ev.date}</div>
                    </div>
                `;
                btn.onclick = () => selectEvent(key);
                list.appendChild(btn);
            });
        }

        function openPortalModal() {
            document.getElementById('portalModal').classList.remove('hidden');
        }

        function selectEvent(key) {
            currentEventKey = key;
            const currentEvent = EVENTS_CONFIG[key];

            FOLDER_ID = currentEvent.folderId;
            STORAGE_KEY = `favs_${key}`;

            document.getElementById('coupleTitle').textContent = currentEvent.title;
            document.getElementById('eventDate').textContent = currentEvent.date;
            document.title = `${currentEvent.title} — Live Gallery`;

            document.getElementById('gallery').innerHTML = '';
            document.getElementById('portalModal').classList.add('hidden');

            updateFavCount();
            fetchPhotos();
        }

        function getFavorites() {
            try {
                return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
            } catch (e) {
                return new Set();
            }
        }

        function saveFavorites(favSet) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...favSet]));
            updateFavCount();
        }

        function updateFavCount() {
            if (!STORAGE_KEY) return;
            const favs = getFavorites();
            document.getElementById('favCount').textContent = favs.size;
        }

        function toggleLike(event, fileId) {
            event.stopPropagation();
            const favs = getFavorites();
            const btn = event.currentTarget;

            if (favs.has(fileId)) {
                favs.delete(fileId);
                btn.classList.remove('liked');
                btn.innerHTML = '🤍';
            } else {
                favs.add(fileId);
                btn.classList.add('liked');
                btn.innerHTML = '❤️';
            }

            saveFavorites(favs);
            applyFilter();
        }

        function setFilter(filterMode) {
            currentFilter = filterMode;
            document.getElementById('btnAll').classList.toggle('active', filterMode === 'all');
            document.getElementById('btnFavorites').classList.toggle('active', filterMode === 'favorites');
            applyFilter();
        }

        function applyFilter() {
            const favs = getFavorites();
            const items = document.querySelectorAll('.photo-item');
            let visibleCount = 0;

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (currentFilter === 'all') {
                    item.classList.remove('hidden');
                    visibleCount++;
                } else {
                    if (favs.has(id)) {
                        item.classList.remove('hidden');
                        visibleCount++;
                    } else {
                        item.classList.add('hidden');
                    }
                }
            });

            const emptyState = document.getElementById('emptyState');
            if (currentFilter === 'favorites' && visibleCount === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes} น.`;
        }

        function preloadHighRes(fastPreviewUrl, fullUrl) {
            if (!imageCache.has(fullUrl)) {
                const img = new Image();
                img.src = fastPreviewUrl;
                const fullImg = new Image();
                fullImg.src = fullUrl;
                imageCache.set(fullUrl, true);
            }
        }

        function getBaseFileName(name) {
            return name.replace(/\s*\(\d+\)\s*/g, '').replace(/_copy\d*/gi, '').toLowerCase();
        }

        async function fetchPhotos() {
            if (!FOLDER_ID || document.getElementById('photoModal').classList.contains('active')) return;

            const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,name,createdTime)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const gallery = document.getElementById('gallery');
                const favs = getFavorites();

                if (data.files && data.files.length > 0) {
                    const existingIds = new Set([...document.querySelectorAll('.photo-item')].map(item => item.getAttribute('data-id')));
                    const existingNames = new Set([...document.querySelectorAll('.photo-item img')].map(img => img.getAttribute('data-clean-name')));

                    const fragment = document.createDocumentFragment();
                    let hasNewPhoto = false;

                    data.files.forEach(file => {
                        const cleanName = getBaseFileName(file.name);

                        if (!existingIds.has(file.id) && !existingNames.has(cleanName)) {
                            hasNewPhoto = true;
                            existingIds.add(file.id);
                            existingNames.add(cleanName);

                            const item = document.createElement('div');
                            item.className = 'photo-item';
                            item.setAttribute('data-id', file.id);

                            const thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=s400`;
                            const fastPreviewUrl = `https://lh3.googleusercontent.com/d/${file.id}=s1600`;
                            const fullUrl = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
                            const timeText = formatTime(file.createdTime);
                            const isLiked = favs.has(file.id);

                            item.innerHTML = `
                                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(event, '${file.id}')">
                                    ${isLiked ? '❤️' : '🤍'}
                                </button>
                                <img src="${thumbUrl}" alt="${file.name}" data-clean-name="${cleanName}" crossorigin="anonymous" loading="lazy" 
                                     ontouchstart="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onmouseenter="preloadHighRes('${fastPreviewUrl}', '${fullUrl}')" 
                                     onclick="openModal('${fastPreviewUrl}', '${fullUrl}', '${file.id}')">
                                <div class="time-badge">🕒 ${timeText}</div>
                            `;
                            fragment.appendChild(item);
                        }
                    });

                    if (hasNewPhoto) {
                        gallery.insertBefore(fragment, gallery.firstChild);
                        applyFilter();
                    }
                }
            } catch (err) { console.error(err); }
        }

        function openModal(fastPreviewUrl, fullUrl, fileId) {
            const modalImg = document.getElementById('modalImg');
            
            modalImg.src = fastPreviewUrl;
            modalImg.srcset = `${fullUrl} 1x`;
            
            document.getElementById('downloadBtn').href = fullUrl;
            document.getElementById('photoModal').classList.add('active');

            const fullImg = new Image();
            fullImg.src = fullUrl;
            fullImg.onload = () => {
                modalImg.src = fullUrl;
            };
        }

        function hideModal() { 
            const modalImg = document.getElementById('modalImg');
            modalImg.src = '';
            modalImg.srcset = '';
            document.getElementById('photoModal').classList.remove('active'); 
        }

        function closeModal(event) { if (event.target.classList.contains('modal')) hideModal(); }

        window.addEventListener('DOMContentLoaded', () => {
            renderPortalButtons();

            const urlParams = new URLSearchParams(window.location.search);
            const paramEvent = urlParams.get('event');

            if (paramEvent && EVENTS_CONFIG[paramEvent]) {
                selectEvent(paramEvent);
            } else {
                openPortalModal();
            }

            setInterval(fetchPhotos, 6000);
        });
    </script>
</body>

</html>
